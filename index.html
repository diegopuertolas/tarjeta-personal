<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Perfil Personal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <article class="card">
    <div class="card__header">
      <div class="card__text-container">
        <h1 class="card__title">
          Diego Puértolas Ruiz
        </h1>
        <div class="card__link">
          <a class="card__website" href="https://diegopuertolas.me" target="_blank">Portfolio Web</a>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-mouse-pointer preview-icon">
            <path d="M12.586 12.586 19 19" />
            <path
              d="M3.688 3.037a.497.497 0 0 0-.651.651l6.5 15.999a.501.501 0 0 0 .947-.062l1.569-6.083a2 2 0 0 1 1.448-1.479l6.124-1.579a.5.5 0 0 0 .063-.947z" />
          </svg>
        </div>
      </div>
      <div class="card__img-container">
        <img class="card__img" src="./assets/dark-profile-photo.jpg" alt="Foto de Perfil">
      </div>
    </div>
    <p class="card__description">
      Estudiante de Desarrollo de Aplicaciones Web en Centro San Valero
    </p>

    <ul class="card__list">
      <li>Esfuerzo</li>
      <li>Dedicación</li>
      <li>Motivación</li>
    </ul>
  </article>
</body>

</html>
